<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elasticsearch Shards and Replicas</title>
<style>
:root{--bg:#0f172a;--panel:#0b1224;--line:#334155;--text:#f1f5f9;--muted:#94a3b8;--accent:#f59e0b}
html,body{margin:0;height:100%;background:#020617;color:var(--text);font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
#wrap{display:flex;flex-direction:column;height:100vh}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 16px}
#svg{display:block;width:100%;height:auto;max-height:100%;aspect-ratio:16/9;max-width:calc((100vh - 120px) * 16 / 9);cursor:pointer;background:#0f172a;border-radius:6px}
#controls{padding:6px 16px 12px;background:#0b1224;border-top:1px solid var(--line)}
#bar{position:relative;height:14px;background:#1e293b;border-radius:7px;cursor:pointer;margin:6px 0 10px}
#fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:7px;width:0}
.tick{position:absolute;top:-3px;width:3px;height:20px;background:#e2e8f0;opacity:.55;border-radius:2px}
#row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:15px}
button,select{font:inherit;background:#1e293b;color:var(--text);border:1px solid #475569;border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
#play{min-width:100px;background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700}
#label{font-weight:700}
#time{color:var(--muted);font-variant-numeric:tabular-nums}
#chips{display:flex;gap:4px;margin-left:auto}
#chips button{padding:5px 0;width:34px;font-size:13px}
#chips button.on{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700}
#chips button.done{border-color:#64748b;color:#cbd5e1}
label{color:var(--muted);display:flex;gap:6px;align-items:center}
body.render #controls{display:none}
body.render #stage{padding:0}
body.render #svg{width:1920px;height:1080px;max-width:none;border-radius:0}
@media (max-width:700px){#chips{margin-left:0}}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" aria-label="Elasticsearch animated explainer"></svg></div>
  <div id="controls">
    <div id="bar" title="Click to jump within the scene"><div id="fill"></div><div id="ticks"></div></div>
    <div id="row">
      <button id="prev" title="Previous scene (Left arrow)">&#8249; Prev</button>
      <button id="play" title="Play / Pause (Space)">&#9654; Play</button>
      <button id="next" title="Next scene (Right arrow)">Next &#8250;</button>
      <span id="label"></span>
      <span id="time"></span>
      <label title="Stop automatically at every numbered step so the teacher can talk"><input type="checkbox" id="autopause"> Pause at each step</label>
      <label>Speed <select id="speed"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select></label>
      <div id="chips"></div>
    </div>
  </div>
</div>
<script>
'use strict';
/* ================= basics ================= */
const NS = 'http://www.w3.org/2000/svg';
const SANS = 'Inter, "Segoe UI", Helvetica, Arial, sans-serif';
const MONO = '"JetBrains Mono", Consolas, Menlo, "Courier New", monospace';
const C = {
  bg:'#0f172a', panel:'#111c33', panel2:'#1e293b', line:'#334155', text:'#f1f5f9', muted:'#94a3b8',
  green:'#22c55e', greenDark:'#052e16', greenTint:'rgba(34,197,94,0.13)',
  blue:'#7dd3fc', blueTint:'rgba(125,211,252,0.12)',
  node:'#1e293b', nodeStroke:'#64748b', gold:'#facc15',
  req:'#f59e0b', ack:'#c084fc', fail:'#ef4444', paper:'#e2e8f0', ink:'#0f172a'
};
const svg = document.getElementById('svg');
svg.setAttribute('font-family', SANS);

function el(tag, a, p){ const e = document.createElementNS(NS, tag); if (a) for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; }
function T(p, x, y, s, o = {}){
  const e = el('text', {x, y, 'font-size':o.fs||32, 'font-weight':o.fw||600, fill:o.fill||C.text, 'text-anchor':o.anchor||'start'}, p);
  if (o.mono) e.setAttribute('font-family', MONO);
  e.textContent = s; return e;
}
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3)/2;
const P = (t, a, b) => ease(clamp((t - a)/(b - a)));           // eased progress a->b
const lerp = (a, b, p) => a + (b - a)*p;
const win = (t, a, b, f = .45) => Math.min(P(t, a, a + f), 1 - P(t, b - f, b)); // fade in at a, out at b
const pulse = (t, a, b) => (t > a && t < b) ? .5 - .5*Math.cos((t - a)*Math.PI*2/ .9) : 0;
function op(e, o){ o = clamp(o); e.setAttribute('opacity', o < .002 ? 0 : o.toFixed(3)); e.style.visibility = o < .002 ? 'hidden' : 'visible'; }
function tr(e, x, y, s = 1, r = 0){ e.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})` + (s !== 1 ? ` scale(${s.toFixed(4)})` : '') + (r ? ` rotate(${r.toFixed(1)})` : '')); }
function hex(c){ c = c.replace('#',''); return [0,2,4].map(i => parseInt(c.substr(i,2),16)); }
function mix(a, b, p){ const A = hex(a), B = hex(b); return 'rgb(' + A.map((v,i) => Math.round(lerp(v, B[i], clamp(p)))).join(',') + ')'; }
function textW(t, s, fs){ let w = 0; try { w = t.getComputedTextLength(); } catch(e){} return w || s.length*fs*.56; }

/* ================= components ================= */
function Tag(p, x, y, s, o = {}){
  const g = el('g', {}, p); const fs = o.fs || 26;
  const r = el('rect', {}, g);
  const t = T(g, x, y + fs*.35, s, {fs, fw:o.fw||700, fill:o.color||C.text, anchor:'middle', mono:o.mono});
  const w = textW(t, s, fs), px = o.px || fs*.7, h = fs*1.75;
  const at = {x:x - w/2 - px, y:y - h/2, width:w + 2*px, height:h, rx:o.rx ?? h/2, fill:o.fill||C.panel2, stroke:o.stroke||'none', 'stroke-width':o.sw||3};
  for (const k in at) r.setAttribute(k, at[k]);
  g.text = t; return g;
}
function Crown(p, s = 1){
  const g = el('g', {}, p); const k = el('g', {transform:`scale(${s})`}, g);
  el('path', {d:'M-28 14 L-30 -12 L-14 1 L0 -21 L14 1 L30 -12 L28 14 Z', fill:C.gold, stroke:'#a16207', 'stroke-width':2.5, 'stroke-linejoin':'round'}, k);
  el('rect', {x:-28, y:16, width:56, height:9, rx:3, fill:C.gold, stroke:'#a16207', 'stroke-width':2}, k);
  [[-30,-12],[0,-21],[30,-12]].forEach(([x,y]) => el('circle', {cx:x, cy:y, r:5, fill:C.gold, stroke:'#a16207', 'stroke-width':2}, k));
  return g;
}
function Client(p, x, y, o = {}){
  const g = el('g', {transform:`translate(${x} ${y})`}, p);
  el('rect', {x:-75, y:-58, width:150, height:100, rx:10, fill:'#1e293b', stroke:'#cbd5e1', 'stroke-width':5}, g);
  el('rect', {x:-60, y:-44, width:120, height:72, rx:4, fill:'#334155'}, g);
  el('path', {d:'M-100 48 H100 L114 66 H-114 Z', fill:'#cbd5e1'}, g);
  if (!o.nolabel) T(g, 0, 108, 'Client', {fs:30, fw:700, anchor:'middle'});
  return g;
}
function Doc(p, w, h, label, o = {}){
  const g = el('g', {}, p); const x = -w/2, y = -h/2, f = Math.min(w, h)*.26;
  el('path', {d:`M${x} ${y} H${x+w-f} L${x+w} ${y+f} V${y+h} H${x} Z`, fill:o.ghost?'rgba(15,23,42,.6)':C.paper, stroke:o.ghost?C.paper:'#94a3b8', 'stroke-width':o.ghost?4:2, 'stroke-dasharray':o.ghost?'10 7':'none'}, g);
  el('path', {d:`M${x+w-f} ${y} V${y+f} H${x+w}`, fill:'none', stroke:'#94a3b8', 'stroke-width':2}, g);
  if (label) T(g, 0, o.ly ?? (y + h*.4), label, {fs:o.fs||24, fw:800, fill:o.ghost?C.paper:C.ink, anchor:'middle', mono:true});
  const n = o.lines ?? 3;
  for (let i = 0; i < n; i++) el('rect', {x:x + w*.16, y:y + h*.56 + i*h*.12, width:w*.68, height:Math.max(3, h*.05), rx:2, fill:o.ghost?C.muted:'#94a3b8'}, g);
  return g;
}
function Check(p, x, y, r = 18, col = '#16a34a'){
  const g = el('g', {transform:`translate(${x} ${y})`}, p);
  el('circle', {r, fill:col, stroke:'#fff', 'stroke-width':3}, g);
  el('path', {d:`M${-r*.45} ${r*.02} L${-r*.1} ${r*.36} L${r*.5} ${-r*.34}`, fill:'none', stroke:'#fff', 'stroke-width':r*.24, 'stroke-linecap':'round', 'stroke-linejoin':'round'}, g);
  return g;
}
function Cross(p, x, y, r = 18){
  const g = el('g', {transform:`translate(${x} ${y})`}, p);
  el('circle', {r, fill:C.fail, stroke:'#fff', 'stroke-width':3}, g);
  const k = r*.38; el('path', {d:`M${-k} ${-k} L${k} ${k} M${k} ${-k} L${-k} ${k}`, stroke:'#fff', 'stroke-width':r*.24, 'stroke-linecap':'round'}, g);
  return g;
}
function NodeBox(p, top, N){
  const {x, y, w, h} = N; const g = el('g', {}, p);
  const r = el('rect', {x, y, width:w, height:h, rx:30, fill:C.node, stroke:C.nodeStroke, 'stroke-width':4}, g);
  T(g, x + 28, y + 48, N.label, {fs:N.fs||34, fw:800});
  const fx = el('g', {}, top || g); const m = 36;
  el('path', {d:`M${x+m} ${y+m} L${x+w-m} ${y+h-m} M${x+w-m} ${y+m} L${x+m} ${y+h-m}`, stroke:C.fail, 'stroke-width':10, 'stroke-linecap':'round', opacity:.7}, fx);
  Tag(fx, x + w/2, y + h/2, 'FAILED', {fill:C.fail, color:'#fff', fs:34, fw:800});
  op(fx, 0);
  return Object.assign({}, N, {cx:x + w/2, cy:y + h/2, g, r, fx,
    set(o = 1, f = 0){ op(g, o); r.setAttribute('stroke', mix(C.nodeStroke, C.fail, f)); r.setAttribute('fill', mix(C.node, '#3b1219', f)); r.setAttribute('stroke-width', 4 + 3*f); op(fx, f*o); }});
}
function Shard(p, o){
  const w = o.w || 140, h = o.h || 100, fs = o.fs || 40; const g = el('g', {}, p);
  const ring = el('rect', {x:-w/2-12, y:-h/2-12, width:w+24, height:h+24, rx:24, fill:'none', stroke:o.ring||C.req, 'stroke-width':6}, g);
  const rg = el('g', {}, g);
  el('rect', {x:-w/2+2.5, y:-h/2+2.5, width:w-5, height:h-5, rx:15, fill:C.blueTint, stroke:C.blue, 'stroke-width':5}, rg);
  T(rg, 0, fs*.36, o.r || '', {fs, fw:800, fill:C.blue, anchor:'middle'});
  const pg = el('g', {}, g);
  el('rect', {x:-w/2, y:-h/2, width:w, height:h, rx:16, fill:C.green}, pg);
  T(pg, 0, fs*.36, o.p || '', {fs, fw:800, fill:C.greenDark, anchor:'middle'});
  const dg = el('g', {}, g);
  el('rect', {x:-w/2, y:-h/2, width:w, height:h, rx:16, fill:'#334155', stroke:'#475569', 'stroke-width':3}, dg);
  T(dg, 0, fs*.36, o.kind === 'P' ? o.p : o.r, {fs, fw:800, fill:'#64748b', anchor:'middle'});
  const S = {g, w, h, x:o.x || 0, y:o.y || 0, k:o.kind === 'P' ? 1 : 0,
    set(x = S.x, y = S.y, s = 1, a = 1, k = S.k, rg_ = 0, dead = 0){ tr(g, x, y, s); op(g, a); op(pg, k); op(rg, k >= .999 ? 0 : 1); op(ring, rg_); op(dg, dead); }};
  S.set(); return S;
}
/* a request/response arrow that draws itself along a path, with a travelling dot and a numbered badge */
function Flow(p, d, o = {}){
  const color = o.color || C.req; const g = el('g', {}, p);
  const path = el('path', {d, fill:'none', stroke:color, 'stroke-width':o.w || 6, 'stroke-linecap':'round'}, g);
  const len = path.getTotalLength(); path.setAttribute('stroke-dasharray', len + ' ' + len);
  const e1 = path.getPointAtLength(len), e0 = path.getPointAtLength(Math.max(0, len - 5));
  const ang = Math.atan2(e1.y - e0.y, e1.x - e0.x)*180/Math.PI;
  const head = el('polygon', {points:'6,0 -20,-13 -20,13', fill:color, transform:`translate(${e1.x} ${e1.y}) rotate(${ang})`}, g);
  let badge = null;
  if (o.num != null){
    const m = path.getPointAtLength(len*(o.numAt ?? .5));
    badge = el('g', {transform:`translate(${m.x + (o.nx || 0)} ${m.y + (o.ny || 0)})`}, g);
    el('circle', {r:25, fill:color, stroke:C.bg, 'stroke-width':5}, badge);
    T(badge, 0, 10, String(o.num), {fs:29, fw:800, fill:C.ink, anchor:'middle'});
  }
  const pk = el('g', {}, p);
  el('circle', {r:24, fill:color, opacity:.28}, pk);
  el('circle', {r:14, fill:color, stroke:'#fff', 'stroke-width':3}, pk);
  if (o.label) Tag(pk, 0, -46, o.label, {fs:22, fill:'#0b1224', color, stroke:color, sw:2});
  const F = {g, path, len, head, badge, pk,
    pt(q){ return path.getPointAtLength(len*clamp(q)); },
    set(q, lineO, pkO){ path.setAttribute('stroke-dashoffset', len*(1 - q)); op(g, lineO); op(head, q > .97 ? 1 : 0);
      if (badge) op(badge, clamp(q*4)); const pt = path.getPointAtLength(len*q); tr(pk, pt.x, pt.y); op(pk, pkO); }};
  F.set(0, 0, 0); return F;
}
function run(f, t, a, b, dim = 1e9, keep = .22){
  const q = P(t, a, b); const lo = t < a ? 0 : lerp(1, keep, P(t, dim, dim + .6));
  f.set(q, lo, (t >= a && t <= b + .12) ? 1 : 0);
}
function Dot(p, color){ const g = el('g', {}, p); el('circle', {r:20, fill:color, opacity:.28}, g); el('circle', {r:12, fill:color, stroke:'#fff', 'stroke-width':3}, g); op(g, 0); return g; }
function dotOn(dot, f, q, show){ const pt = f.pt(q); tr(dot, pt.x, pt.y); op(dot, show ? 1 : 0); }
function Arrow(p, x1, y1, x2, y2, color, w = 6){
  const g = el('g', {}, p); const a = Math.atan2(y2 - y1, x2 - x1);
  el('line', {x1, y1, x2:x2 - Math.cos(a)*14, y2:y2 - Math.sin(a)*14, stroke:color, 'stroke-width':w, 'stroke-linecap':'round'}, g);
  el('polygon', {points:'6,0 -18,-12 -18,12', fill:color, transform:`translate(${x2} ${y2}) rotate(${a*180/Math.PI})`}, g);
  return g;
}
function Panel(p, x, y, w, h, title){
  const g = el('g', {}, p);
  const r = el('rect', {x, y, width:w, height:h, rx:22, fill:C.panel, stroke:C.line, 'stroke-width':3}, g);
  if (title) T(g, x + 24, y + 40, title, {fs:25, fw:800, fill:C.muted});
  g.r = r; return g;
}
function buildLegend(p){
  const cols = [0, 200, 400, 600], rows = [0, 46];
  const it = (c, r, draw, label) => { const g = el('g', {transform:`translate(${cols[c]} ${rows[r]})`}, p); draw(g); T(g, 56, 9, label, {fs:24, fw:600}); };
  it(0, 0, g => el('rect', {x:0, y:-15, width:44, height:30, rx:7, fill:C.green}, g), 'Primary');
  it(1, 0, g => el('rect', {x:2, y:-13, width:40, height:26, rx:7, fill:C.blueTint, stroke:C.blue, 'stroke-width':4}, g), 'Replica');
  it(2, 0, g => el('rect', {x:0, y:-16, width:44, height:32, rx:10, fill:C.node, stroke:C.nodeStroke, 'stroke-width':3}, g), 'Node');
  it(3, 0, g => { const c = Crown(g, .62); tr(c, 22, 1); }, 'Master');
  it(0, 1, g => { const c = Client(g, 0, 0, {nolabel:true}); c.setAttribute('transform', 'translate(22 -3) scale(.2)'); }, 'Client');
  it(1, 1, g => el('circle', {cx:22, cy:0, r:12, fill:C.req, stroke:'#fff', 'stroke-width':2.5}, g), 'Request');
  it(2, 1, g => el('circle', {cx:22, cy:0, r:12, fill:C.ack, stroke:'#fff', 'stroke-width':2.5}, g), 'Response');
  it(3, 1, g => { el('rect', {x:0, y:-15, width:44, height:30, rx:7, fill:'#3b1219', stroke:C.fail, 'stroke-width':3}, g);
    el('path', {d:'M12 -7 L32 7 M32 -7 L12 7', stroke:C.fail, 'stroke-width':4, 'stroke-linecap':'round'}, g); }, 'Failed');
}

/* ===== shared 3-node cluster layout (scenes 5-8) ===== */
const N1 = {x:520, y:360, w:380, h:240, label:'Node 1'};
const N2 = {x:1240, y:160, w:380, h:240, label:'Node 2'};
const N3 = {x:1240, y:590, w:380, h:240, label:'Node 3'};
const slot = (N, k) => ({x:N.x + (k ? 275 : 105), y:N.y + 145});
const crownPos = N => ({x:N.x + N.w - 52, y:N.y + 42});
function buildCluster(g){
  const frame = el('g', {}, g);
  el('rect', {x:460, y:122, width:1230, height:752, rx:36, fill:'rgba(148,163,184,0.04)', stroke:C.line, 'stroke-width':3, 'stroke-dasharray':'14 10'}, frame);
  T(frame, 490, 166, 'Cluster', {fs:28, fill:C.muted, fw:700});
  const lyN = el('g', {}, g), lyS = el('g', {}, g), lyF = el('g', {}, g), lyO = el('g', {}, g), lyT = el('g', {}, g);
  const n = [N1, N2, N3].map(N => NodeBox(lyN, lyO, N));
  const mk = (N, k, kind, id) => { const q = slot(N, k); return Shard(lyS, {x:q.x, y:q.y, kind, p:'P' + id, r:'R' + id}); };
  const s = {R0a:mk(N1,0,'R',0), P1a:mk(N1,1,'P',1), R0b:mk(N2,0,'R',0), R1b:mk(N2,1,'R',1), P0c:mk(N3,0,'P',0), R1c:mk(N3,1,'R',1)};
  const crown = Crown(lyT, .95); const cp = crownPos(N1); tr(crown, cp.x, cp.y);
  return {frame, n, s, crown, lyF, lyT, lyS, lyN, lyO};
}

/* ================= scenes ================= */
const SC = [];

/* ---------- 1. Index and shards ---------- */
SC.push({title:'Index and shards', dur:30, legendFrom:4.9,
cap:[[0,'Our color code. These colors mean the same thing in every scene.'],
     [5,'Meet an index: a collection of documents, like a big table full of rows.'],
     [9.5,'Shards are horizontal slices of an index.'],
     [17.5,'Every shard holds whole documents, never pieces of a document.'],
     [22.5,'Each shard is an independent unit: it can live on any node, and can even move to another node.']],
build(g){
  const lyNodes = el('g', {}, g);
  const NN = [{x:60,y:300,w:580,h:330,label:'Node 1'},{x:670,y:300,w:580,h:330,label:'Node 2'},{x:1280,y:300,w:580,h:330,label:'Node 3'}].map(N => NodeBox(lyNodes, lyNodes, N));
  const idx = el('g', {}, g);
  el('rect', {x:740, y:138, width:440, height:722, rx:26, fill:'rgba(148,163,184,0.06)', stroke:C.paper, 'stroke-width':3}, idx);
  const idxLab = T(g, 960, 186, 'Index: products', {fs:32, fw:800, anchor:'middle'});
  const shards = [];
  for (let i = 0; i < 4; i++){
    const sg = el('g', {}, g); const fr = el('g', {}, sg);
    el('rect', {x:-180, y:-115, width:360, height:230, rx:18, fill:C.greenTint, stroke:C.green, 'stroke-width':5}, fr);
    el('path', {d:'M-180 -67 V-97 a18 18 0 0 1 18 -18 H162 a18 18 0 0 1 18 18 V-67 Z', fill:C.green}, fr);
    T(fr, 0, -80, 'Shard ' + 'ABCD'[i], {fs:30, fw:800, fill:C.greenDark, anchor:'middle'});
    const rows = [];
    for (let j = 0; j < 3; j++){
      const rg = el('g', {transform:`translate(-165 ${-59 + j*52})`}, sg);
      el('rect', {width:330, height:44, rx:8, fill:C.paper}, rg);
      el('path', {d:'M14 7 h15 l7 7 v23 h-22 z', fill:'#94a3b8'}, rg);
      T(rg, 52, 30, `{ "_id": ${i*3 + j + 1}, … }`, {fs:23, mono:true, fill:C.ink, fw:700});
      rows.push(rg);
    }
    const ring = el('rect', {x:-176, y:-13, width:352, height:56, rx:12, fill:'none', stroke:C.req, 'stroke-width':5}, sg);
    shards.push({sg, fr, rows, ring});
  }
  const cuts = [1,2,3].map(k => el('line', {x1:715, y1:211 + 156*k, x2:715, y2:211 + 156*k, stroke:C.req, 'stroke-width':5, 'stroke-dasharray':'18 10'}, g));
  const good = el('g', {}, g); Tag(good, 730, 598, '✓ one whole document', {fill:'#14532d', color:'#bbf7d0', fs:28});
  const bad = el('g', {}, g);
  const bh = el('g', {transform:'translate(1310 590)'}, bad);

    if (k === 1) [0,1,2,3].forEach(i => { el('rect', {x:-118 + i*60, y:-28, width:52, height:56, rx:10, fill:C.green}, ic); T(ic, -92 + i*60, 10, 'ABCD'[i], {fs:28, fw:800, anchor:'middle', fill:C.greenDark}); });
    if (k === 2){ Shard(ic, {x:-60, y:0, kind:'P', p:'P0', w:96, h:72, fs:32}); Shard(ic, {x:60, y:0, kind:'R', r:'R0', w:96, h:72, fs:32}); }
    if (k === 3){ el('rect', {x:-120, y:-62, width:240, height:124, rx:20, fill:C.node, stroke:C.nodeStroke, 'stroke-width':4}, ic);
      Shard(ic, {x:-50, y:8, kind:'P', p:'P1', w:80, h:60, fs:28}); Shard(ic, {x:50, y:8, kind:'R', r:'R0', w:80, h:60, fs:28}); }
    if (k === 4){ el('rect', {x:-140, y:-75, width:280, height:150, rx:22, fill:'none', stroke:C.muted, 'stroke-width':3, 'stroke-dasharray':'10 7'}, ic);
      [-82, 0, 82].forEach((nx, i) => el('rect', {x:nx - 34, y:-28, width:68, height:76, rx:14, fill:C.node, stroke:C.nodeStroke, 'stroke-width':3}, ic));
      const cr = Crown(ic, .55); tr(cr, -82, -46); }
    return bg; });
  const tk = [
    ['W', C.req, 'Writes: ', 'coordinating node → primary → replicas → ack'],
    ['R', C.ack, 'Reads: ', 'any copy (primary or replica) can answer'],
    ['+', C.blue, 'More replicas = ', 'faster reads + better availability, NOT faster writes']
  ].map(([ic, col, a, b], i) => { const y = 520 + i*120; const r = el('g', {}, g);
    el('rect', {x:110, y:y - 50, width:1700, height:100, rx:24, fill:C.panel, stroke:col, 'stroke-width':3}, r);
    el('circle', {cx:180, cy:y, r:32, fill:col}, r); T(r, 180, y + 13, ic, {fs:38, fw:900, anchor:'middle', fill:C.ink});
    const tx = T(r, 240, y + 15, '', {fs:42, fw:700}); const s1 = el('tspan', {fill:col, 'font-weight':900}, tx); s1.textContent = a;
    const s2 = el('tspan', {}, tx); s2.textContent = b; return r; });
  return t => {
    boxes.forEach((b, k) => { op(b, P(t, .4 + k*1.5, 1.1 + k*1.5)); });
    tk.forEach((r, i) => { op(r, P(t, 9.4 + i*4.4, 10.1 + i*4.4)); tr(r, lerp(-40, 0, P(t, 9.4 + i*4.4, 10.3 + i*4.4)), 0); });
  };
}});

/* ================= engine ================= */
const starts = []; let TOTAL = 0; SC.forEach(s => { starts.push(TOTAL); TOTAL += s.dur; });
const bg = el('rect', {x:0, y:0, width:1920, height:1080, fill:C.bg}, svg);
const sceneLayer = el('g', {}, svg);
const hdr = el('g', {}, svg);
el('rect', {x:0, y:0, width:1920, height:110, fill:'#0b1224'}, hdr);
el('line', {x1:0, y1:110, x2:1920, y2:110, stroke:C.line, 'stroke-width':2}, hdr);
el('circle', {cx:70, cy:56, r:32, fill:C.req}, hdr);
const hNum = T(hdr, 70, 68, '1', {fs:34, fw:900, anchor:'middle', fill:C.ink});
const hTitle = T(hdr, 122, 72, '', {fs:44, fw:800});
const hLegend = el('g', {transform:'translate(1120 32)'}, hdr); buildLegend(hLegend);
const capG = el('g', {}, svg);
el('rect', {x:0, y:900, width:1920, height:180, fill:'#0b1224'}, capG);
el('line', {x1:0, y1:900, x2:1920, y2:900, stroke:C.line, 'stroke-width':2}, capG);
const capInner = el('g', {}, capG);
let cur = -1, upd = null, capKey = '', gNow = 0;

function buildScene(i){
  while (sceneLayer.firstChild) sceneLayer.removeChild(sceneLayer.firstChild);
  op(sceneLayer, 1);
  const g = el('g', {}, sceneLayer);
  upd = SC[i].build(g); cur = i; capKey = '';
  hNum.textContent = String(i + 1); hTitle.textContent = SC[i].title;
  // shrink long titles so they never collide with the legend
  hTitle.setAttribute('font-size', 44); const w = textW(hTitle, SC[i].title, 44);
  if (w > 960) hTitle.setAttribute('font-size', Math.floor(44*960/w));
}
function capIndex(i, lt){ const cs = SC[i].cap; let ci = 0; for (let k = 0; k < cs.length; k++) if (cs[k][0] <= lt + 1e-6) ci = k; return ci; }
function drawCaption(s){
  while (capInner.firstChild) capInner.removeChild(capInner.firstChild);
  let step = null; const m = s.match(/^\((\d+)\)\s*/); if (m){ step = m[1]; s = s.slice(m[0].length); }
  let fs = 40; let maxW = step ? 1640 : 1760;
  const meas = T(capInner, 0, -999, '', {fs, fw:600});
  const wrap = f => { meas.setAttribute('font-size', f); const words = s.split(' '); const lines = []; let line = '';
    for (const w of words){ const tryL = line ? line + ' ' + w : w; meas.textContent = tryL;
      if (textW(meas, tryL, f) > maxW && line){ lines.push(line); line = w; } else line = tryL; }
    if (line) lines.push(line); return lines; };
  let lines = wrap(fs); if (lines.length > 2){ fs = 35; lines = wrap(fs); }
  if (lines.length === 2){ // balance the two lines so a single word never dangles
    meas.setAttribute('font-size', fs); meas.textContent = s; const full = textW(meas, s, fs); const keep = maxW;
    for (let w = Math.ceil(full/2); w < keep; w += 16){ maxW = w; const l2 = wrap(fs); if (l2.length <= 2){ lines = l2; break; } }
    maxW = keep; }
  let mw = 0; lines.forEach(l => { meas.textContent = l; mw = Math.max(mw, textW(meas, l, fs)); });
  capInner.removeChild(meas);
  const lh = fs*1.3, cx = 960 + (step ? 44 : 0), y0 = 990 - (lines.length - 1)*lh/2 + fs*.35;
  lines.forEach((l, k) => T(capInner, cx, y0 + k*lh, l, {fs, fw:600, anchor:'middle'}));
  if (step){ const sx = cx - mw/2 - 58; el('circle', {cx:sx, cy:990, r:32, fill:C.req}, capInner); T(capInner, sx, 1002, step, {fs:34, fw:900, anchor:'middle', fill:C.ink}); }
}
function render(gt){
  gt = clamp(gt, 0, TOTAL - 1e-4); gNow = gt;
  let i = 0; while (i < SC.length - 1 && gt >= starts[i + 1]) i++;
  if (i !== cur) buildScene(i);
  const lt = gt - starts[i];
  upd(lt);
  op(sceneLayer, P(lt, 0, .5));
  op(hLegend, SC[i].legendFrom != null ? (lt >= SC[i].legendFrom ? 1 : 0) : 1);
  const ci = capIndex(i, lt), key = i + ':' + ci;
  if (key !== capKey){ capKey = key; drawCaption(SC[i].cap[ci][1]); }
  op(capInner, P(lt, SC[i].cap[ci][0], SC[i].cap[ci][0] + .35));
  updateUI(i, lt);
}

/* ================= player UI ================= */
const $ = id => document.getElementById(id);
const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let playing = false, last = 0, uiScene = -1;
SC.forEach((s, i) => { const b = document.createElement('button'); b.textContent = i + 1; b.title = (i + 1) + '. ' + s.title; b.onclick = () => { render(starts[i]); }; $('chips').appendChild(b); });
function updateUI(i, lt){
  if (document.body.classList.contains('render')) return;
  $('fill').style.width = (100*lt/SC[i].dur) + '%';
  $('label').textContent = `Scene ${i + 1}/${SC.length} · ${SC[i].title}`;
  $('time').textContent = `${fmt(lt)} / ${fmt(SC[i].dur)}   ·   total ${fmt(gNow)} / ${fmt(TOTAL)}`;
  if (uiScene !== i){ uiScene = i; const tk = $('ticks'); tk.innerHTML = '';
    SC[i].cap.forEach(c => { if (c[0] <= 0) return; const d = document.createElement('div'); d.className = 'tick'; d.style.left = (100*c[0]/SC[i].dur) + '%'; tk.appendChild(d); });
    [...$('chips').children].forEach((b, k) => { b.className = k === i ? 'on' : k < i ? 'done' : ''; }); }
}
function setPlaying(p){ playing = p; $('play').innerHTML = p ? '&#10074;&#10074; Pause' : '&#9654; Play'; last = performance.now(); if (p) requestAnimationFrame(loop); }
function loop(now){
  if (!playing) return;
  const dt = Math.min(.1, (now - last)/1000)*parseFloat($('speed').value); last = now;
  let nt = gNow + dt;
  if ($('autopause').checked){ // stop exactly at the next step boundary
    const i = cur, lt = gNow - starts[i];
    const nextCap = SC[i].cap.map(c => c[0]).find(c => c > lt + 1e-6);
    const bound = nextCap != null ? starts[i] + nextCap : starts[i] + SC[i].dur;
    if (nt >= bound){ render(bound + 1e-3); setPlaying(false); return; }
  }
  if (nt >= TOTAL){ render(TOTAL); setPlaying(false); return; }
  render(nt); requestAnimationFrame(loop);
}
$('play').onclick = () => { if (!playing && gNow >= TOTAL - .01) render(0); setPlaying(!playing); };
$('next').onclick = () => { if (cur < SC.length - 1) render(starts[cur + 1]); };
$('prev').onclick = () => { const lt = gNow - starts[cur]; render(lt > 1.5 || cur === 0 ? starts[cur] : starts[cur - 1]); };
$('bar').onclick = e => { const r = $('bar').getBoundingClientRect(); render(starts[cur] + SC[cur].dur*clamp((e.clientX - r.left)/r.width)); };
svg.onclick = () => $('play').click();
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space'){ e.preventDefault(); $('play').click(); }
  else if (e.key === 'ArrowRight') $('next').click();
  else if (e.key === 'ArrowLeft') $('prev').click();
  else if (e.key === 'Home') render(0);
});

const RENDER = /[?&]render\b/.test(location.search);
if (RENDER) document.body.classList.add('render');
window.__total = TOTAL; window.__seek = t => { render(t); return true; };
window.__scenes = SC.map((s, i) => ({title:s.title, start:starts[i], dur:s.dur}));
const boot = () => render(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot); else boot();
</script>
